{% extends "base.html" %}



{% block css %}

<link rel="stylesheet"
href="{{ url_for('static', filename='css/login.css') }}">

{% endblock %}





{% block content %}



<div class="login-container">



    <div class="login-card">



        <i class="fa fa-user-circle"></i>



        <h2>

            Login

        </h2>





        <form method="POST">



            <input 
            type="text"
            name="username"
            placeholder="Enter Email or Mobile Number"
            required>





            <input 
            type="password"
            name="password"
            placeholder="Enter Password"
            required>







            <button type="submit" class="login-submit">


                Login


            </button>





        </form>






        <p>

            New to Flipkart?

            <a href="#">

                Create Account

            </a>


        </p>





    </div>



</div>





{% endblock %}
